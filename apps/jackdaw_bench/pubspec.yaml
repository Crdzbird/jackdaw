name: jackdaw_bench
description: On-device benchmarks for jackdaw's native core.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  a2ui_core: ^0.1.1
  flutter:
    sdk: flutter
  genui: ^0.10.4
  jackdaw:
    path: ../../packages/jackdaw
  jackdaw_flutter:
    path: ../../packages/jackdaw_flutter
  jackdaw_native:
    path: ../../packages/jackdaw_native

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  jackdaw_test:
    path: ../../packages/jackdaw_test
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    jackdaw_native:
      build: source

dependency_overrides:
  jackdaw:
    path: ../../packages/jackdaw

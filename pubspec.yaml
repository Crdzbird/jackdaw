name: jackdaw_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/jackdaw
  - packages/jackdaw_a2ui
  - packages/jackdaw_anthropic
  - packages/jackdaw_cli
  - packages/jackdaw_dom
  - packages/jackdaw_gemini
  - packages/jackdaw_mcp
  - packages/jackdaw_native
  - packages/jackdaw_ollama
  - packages/jackdaw_openai
  - packages/jackdaw_test
  - packages/jackdaw_web

hooks:
  user_defines:
    jackdaw_native:
      build: source

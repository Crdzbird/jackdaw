name: jackdaw_dom
description: >-
  Draws jackdaw's A2UI surfaces as plain HTML elements, with no framework:
  each component is built once, and a data write updates only the elements
  that read what it wrote.
version: 1.0.0
repository: https://github.com/Crdzbird/jackdaw/tree/main/packages/jackdaw_dom
topics: [a2ui, genui, web, html]

environment:
  sdk: ^3.13.0

resolution: workspace

platforms:
  web:

dependencies:
  jackdaw: ^1.0.0
  web: ^1.1.1

dev_dependencies:
  test: ^1.33.0
  very_good_analysis: ^11.0.0

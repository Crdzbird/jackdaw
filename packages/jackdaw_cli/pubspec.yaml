name: jackdaw_cli
description: >-
  Command line tools for jackdaw. Inspect session journals and traces,
  compile JSON Schemas to the GBNF grammars used for constrained output,
  and validate JSON against a schema.
version: 0.1.0-dev.1
repository: https://github.com/Crdzbird/jackdaw/tree/main/packages/jackdaw_cli
topics: [ai, llm, cli, agents]

environment:
  sdk: ^3.13.0

resolution: workspace

executables:
  jackdaw:

dependencies:
  jackdaw: ^0.1.0-dev.1

dev_dependencies:
  test: ^1.33.0
  very_good_analysis: ^11.0.0

topics: [ai, llm, testing]

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  jackdaw: ^0.1.0-dev.1
  test: ^1.33.0

dev_dependencies:
  very_good_analysis: ^11.0.0

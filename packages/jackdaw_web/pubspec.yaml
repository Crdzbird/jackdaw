name: jackdaw_web
description: >-
  In-browser inference for jackdaw. Runs GGUF models with wllama (llama.cpp
  compiled to WebAssembly) through the same LanguageModel interface.
version: 1.0.0
repository: https://github.com/Crdzbird/jackdaw/tree/main/packages/jackdaw_web
topics: [ai, llm, web, wasm]

environment:
  sdk: ^3.13.0

resolution: workspace

platforms:
  web:

dependencies:
  jackdaw: ^1.0.0
  jackdaw_openai: ^1.0.0

dev_dependencies:
  jackdaw_test: ^1.0.0
  test: ^1.33.0
  very_good_analysis: ^11.0.0

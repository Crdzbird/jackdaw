name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  house-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./tool/check_house_rules.sh

  dart:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, beta]
        package: [jackdaw, jackdaw_a2ui, jackdaw_anthropic, jackdaw_cli, jackdaw_gemini, jackdaw_mcp, jackdaw_ollama, jackdaw_openai, jackdaw_test]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test --coverage-path=coverage/lcov.info --coverage-package='^${{ matrix.package }}$'
      - run: ../../tool/check_coverage.sh coverage/lcov.info
      - run: dart test -p chrome
        if: matrix.package != 'jackdaw_cli'
      - run: dart test -p chrome --compiler dart2wasm
        if: matrix.package != 'jackdaw_cli'
      - run: dart pub publish --dry-run

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/jackdaw_web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test -p chrome --coverage-path=coverage/lcov.info
      - run: ../../tool/check_coverage.sh coverage/lcov.info 'jackdaw_web/lib/'
      - run: dart test -p chrome --compiler dart2wasm
      - run: dart pub publish --dry-run

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/jackdaw_flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flutter 3.47.7
        working-directory: .
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - run: ../../tool/check_coverage.sh coverage/lcov.info
      - run: flutter pub publish --dry-run


name: native

on:
  push:
    branches: [main]
    tags: ['native-v*']
  pull_request:

permissions:
  contents: read

env:
  NDK_VERSION: 28.2.13676358

jobs:
  cpp-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sanitize: ''
            cc: clang
            cxx: clang++
          - os: ubuntu-latest
            sanitize: ''
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            sanitize: address,undefined
            cc: clang
            cxx: clang++
          - os: ubuntu-latest
            sanitize: thread
            cc: clang
            cxx: clang++
          - os: macos-latest
            sanitize: ''
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y ninja-build
        if: runner.os == 'Linux'
      - run: >
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DJACKDAW_BUILD_TESTS=ON -DJACKDAW_SANITIZE=${{ matrix.sanitize }}
      - run: cmake --build build -j
      - run: ./build/jackdaw_tests
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            key: android-arm64
          - abi: armeabi-v7a
            key: android-arm
          - abi: x86_64
            key: android-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y ninja-build
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
      - name: Build
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          extra=""
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then extra="-DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16"; fi
          if [ "${{ matrix.abi }}" = "armeabi-v7a" ]; then extra="-DGGML_LLAMAFILE=OFF"; fi
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJACKDAW_STRIP=ON \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static $extra
          cmake --build build --target jackdaw -j
      - run: ./tool/check_native_library.sh build/libjackdaw.so "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
      - run: mv build/libjackdaw.so "${{ matrix.key }}-libjackdaw.so"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.key }}
          path: ${{ matrix.key }}-libjackdaw.so

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            key: macos-arm64
            file: libjackdaw.dylib
            args: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          - os: macos-latest
            key: macos-x64
            file: libjackdaw.dylib
            args: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          - os: macos-latest
            key: ios-iphoneos-arm64
            file: libjackdaw.dylib
            args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          - os: macos-latest
            key: ios-iphonesimulator-arm64
            file: libjackdaw.dylib
            args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DGGML_METAL=OFF
          - os: macos-latest
            key: ios-iphonesimulator-x64
            file: libjackdaw.dylib
            args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DGGML_METAL=OFF
          - os: ubuntu-latest
            key: linux-x64
            file: libjackdaw.so
            args: ''
          - os: windows-latest
            key: windows-x64
            file: jackdaw.dll
            args: ''
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y ninja-build
        if: runner.os == 'Linux'
      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJACKDAW_STRIP=ON ${{ matrix.args }}
          cmake --build build --target jackdaw -j
      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          CC: cl
          CXX: cl
        run: |
          cmake -S native -B build
          cmake --build build --config Release --target jackdaw -j
      - run: ./tool/check_native_library.sh build/${{ matrix.file }}
        if: runner.os != 'Windows'
      - run: mv build/${{ matrix.file }} "${{ matrix.key }}-${{ matrix.file }}"
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.key }}
          path: ${{ matrix.key }}-${{ matrix.file }}

  release:
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: [cpp-tests, android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Hash libraries
        run: |
          cd artifacts
          sha256sum * | tee ../SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" artifacts/* SHA256SUMS
          --repo "${GITHUB_REPOSITORY}" --prerelease
          --title "${GITHUB_REF_NAME}"
          --notes "Prebuilt libjackdaw. Copy SHA256SUMS into packages/jackdaw_native/lib/src/hook/prebuilt_hashes.dart."

  dart-native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: packages/jackdaw_native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: sudo apt-get install -y ninja-build
        if: runner.os == 'Linux'
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test hook tool
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --dry-run
